name: kin-cf-waf

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true to disable Anthropic/JS OpenAI/JS block or add skip for kin.fkcodex.com"
        required: true
        default: "false"

jobs:
  waf:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare WAF
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" || { echo NO_TOKEN; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["CF_TOKEN"]
          apply = os.environ.get("APPLY", "false") == "true"

          def cf(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  data=data,
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  print("HTTP", e.code, path, raw[:800])
                  try:
                      return json.loads(raw)
                  except Exception:
                      return {"success": False, "errors": [raw[:200]]}

          v = cf("GET", "/user/tokens/verify")
          print("verify", v.get("success"), v.get("result") or v.get("errors"))

          zones = cf("GET", "/zones?per_page=50")
          print("zones.success", zones.get("success"), zones.get("errors"))
          zone_id = None
          for z in zones.get("result") or []:
              print("zone", z.get("name"), z.get("id"), z.get("status"))
              if "fkcodex" in (z.get("name") or ""):
                  zone_id = z["id"]
          if not zone_id:
              print("fkcodex.com not visible to this token")
              raise SystemExit(0)

          rs = cf("GET", f"/zones/{zone_id}/rulesets/phases/http_request_firewall_custom/entrypoint")
          print("custom.success", rs.get("success"), rs.get("errors"))
          result = rs.get("result") or {}
          print("ruleset", result.get("id"), result.get("name"))
          hit_ids = []
          for i, rule in enumerate(result.get("rules") or []):
              expr = rule.get("expression") or ""
              print(f"RULE[{i}] id={rule.get('id')} action={rule.get('action')} enabled={rule.get('enabled')} desc={rule.get('description')}")
              print("  expr:", expr[:600])
              low = expr.lower()
              if "anthropic/js" in low or "openai/js" in low:
                  hit_ids.append(rule)

          fw = cf("GET", f"/zones/{zone_id}/firewall/rules?per_page=50")
          print("legacy.success", fw.get("success"), fw.get("errors"))
          for r in fw.get("result") or []:
              expr = ((r.get("filter") or {}).get("expression")) or ""
              print("LEGACY", r.get("id"), r.get("action"), r.get("paused"), expr[:400])

          if not apply:
              print("inspect-only complete; hits", [h.get("id") for h in hit_ids])
              raise SystemExit(0)

          ruleset_id = result.get("id")
          if not ruleset_id:
              print("no custom ruleset to patch")
              raise SystemExit(0)

          if hit_ids:
              for h in hit_ids:
                  out = cf("PATCH", f"/zones/{zone_id}/rulesets/{ruleset_id}/rules/{h['id']}", {"enabled": False})
                  print("disabled", h.get("id"), out.get("success"), out.get("errors"))
          else:
              body = {
                  "action": "skip",
                  "action_parameters": {"ruleset": "current"},
                  "description": "Allow coding-agent SDK UAs on kin.fkcodex.com",
                  "enabled": True,
                  "expression": '(http.host eq "kin.fkcodex.com")',
              }
              out = cf("POST", f"/zones/{zone_id}/rulesets/{ruleset_id}/rules", body)
              print("added skip", out.get("success"), out.get("errors"))
          print("apply complete")
          PY
