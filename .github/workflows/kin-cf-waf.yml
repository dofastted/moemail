name: kin-cf-waf-inspect-fix

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set true to patch WAF (skip Anthropic/JS and OpenAI/JS on kin.fkcodex.com)"
        required: true
        default: "false"

jobs:
  waf:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and optionally patch Cloudflare WAF
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "NO_TOKEN"
            exit 1
          fi
          AUTH="Authorization: Bearer ${CF_TOKEN}"
          echo "=== token verify ==="
          curl -sS -H "$AUTH" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" | head -c 800
          echo
          echo "=== zones ==="
          ZJSON=$(curl -sS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones?per_page=50")
          echo "$ZJSON" | python3 -c 'import sys,json
d=json.load(sys.stdin)
print("success", d.get("success"), "errors", d.get("errors"))
for z in d.get("result") or []:
  print(z.get("id"), z.get("name"), z.get("status"))'
          ZONE=$(echo "$ZJSON" | python3 -c 'import sys,json
d=json.load(sys.stdin)
for z in d.get("result") or []:
  if z.get("name") in ("fkcodex.com","fkcodex.com."):
    print(z["id"]); break
  if "fkcodex" in (z.get("name") or ""):
    print(z["id"]); break
')
          echo "ZONE=$ZONE"
          if [ -z "$ZONE" ]; then
            echo "zone fkcodex.com not visible to this token"
            exit 0
          fi
          echo "=== custom firewall entrypoint ==="
          RS=$(curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/rulesets/phases/http_request_firewall_custom/entrypoint")
          echo "$RS" | python3 -c 'import sys,json
d=json.load(sys.stdin)
print("success", d.get("success"), "errors", d.get("errors"))
r=d.get("result") or {}
print("ruleset_id", r.get("id"), "name", r.get("name"))
for i,rule in enumerate(r.get("rules") or []):
  print("--- rule", i, "---")
  print("id", rule.get("id"))
  print("action", rule.get("action"))
  print("enabled", rule.get("enabled"))
  print("description", rule.get("description"))
  print("expression", (rule.get("expression") or "")[:500])
'
          echo "=== managed WAF packages (legacy) ==="
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/firewall/waf/packages" | head -c 400
          echo
          echo "=== firewall rules (legacy) ==="
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/firewall/rules?per_page=50" | python3 -c 'import sys,json
d=json.load(sys.stdin)
print("success", d.get("success"), "errors", d.get("errors"))
for r in d.get("result") or []:
  print(r.get("id"), r.get("action"), r.get("paused"), (r.get("filter") or {}).get("expression","")[:300])
'
          if [ "$APPLY" != "true" ]; then
            echo "inspect-only done"
            exit 0
          fi
          echo "=== APPLY skip rule for kin.fkcodex.com SDK UAs ==="
          # Add a high-priority skip if not present
          python3 - << 'PY2'
import json,os,urllib.request
token=os.environ["CF_TOKEN"]
zone=os.environ.get("ZONE") or open("/tmp/zone").read().strip() if False else None
PY2
          # Get current ruleset and POST a skip rule at the top
          echo "$ZONE" > /tmp/zone_id
          python3 << PY2
import json, os, urllib.request
token = os.environ["CF_TOKEN"]
zone = open("/tmp/zone_id").read().strip()
auth = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

def cf(method, path, body=None):
    req = urllib.request.Request(
        f"https://api.cloudflare.com/client/v4{path}",
        data=None if body is None else json.dumps(body).encode(),
        headers=auth, method=method)
    with urllib.request.urlopen(req) as resp:
        return json.load(resp)

rs = cf("GET", f"/zones/{zone}/rulesets/phases/http_request_firewall_custom/entrypoint")
ruleset = rs.get("result") or {}
rules = ruleset.get("rules") or []
print("existing custom rules:", len(rules))
# Look for existing skip
for r in rules:
    expr = r.get("expression") or ""
    if "kin.fkcodex.com" in expr and r.get("action") == "skip":
        print("skip already present", r.get("id"), expr)
        break
else:
    # Prepend skip for API host
    new_rule = {
        "action": "skip",
        "action_parameters": {"ruleset": "current"},
        "description": "Allow Pi/Codex official SDK UAs on kin.fkcodex.com API",
        "enabled": True,
        "expression": '(http.host eq "kin.fkcodex.com")',
    }
    # Also consider disabling rules that match Anthropic/JS
    patched = False
    for r in rules:
        expr = (r.get("expression") or "")
        if "Anthropic/JS" in expr or "OpenAI/JS" in expr or "anthropic/js" in expr.lower():
            print("FOUND blocking rule", r.get("id"), r.get("action"), expr)
            # disable rather than delete
            try:
                out = cf("PATCH", f"/zones/{zone}/rulesets/{ruleset['id']}/rules/{r['id']}", {"enabled": False})
                print("disabled", r["id"], out.get("success"), out.get("errors"))
                patched = True
            except Exception as e:
                print("patch failed", e)
    if not patched:
        try:
            out = cf("POST", f"/zones/{zone}/rulesets/{ruleset['id']}/rules", new_rule)
            print("added skip", out.get("success"), out.get("errors"))
        except Exception as e:
            print("add skip failed", e)
print("apply done")
PY2
